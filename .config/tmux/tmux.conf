# --- General Settings ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1
set -g mouse on
set-option -g renumber-windows on
set-window-option -g mode-keys vi
set-option -s set-clipboard off
set -g history-limit 20000
set -g extended-keys-format csi-u

# --- Terminal & Image Support (Yazi Fixes) ---
set -g default-terminal "tmux-256color"
# Enable RGB color and Kitty graphics protocol support
set -ga terminal-overrides ",xterm-kitty:Tc"
# Also enable image passthrough for all terminals with Tc
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*:Tc"
set -as terminal-features ',xterm-kitty:RGB:clipboard'
set -as terminal-features ',xterm-256color:RGB:clipboard'
set -as terminal-features ',tmux-256color:RGB:clipboard'

# Allow programs like Yazi to pass images through tmux
set -g allow-passthrough all
# Let terminal clients report focus changes through tmux.
set -s focus-events on
# Ensure environmental variables update correctly for image protocols
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment TERM_PROGRAM_VERSION
set -ga update-environment XDG_SESSION_TYPE
set -ga update-environment KITTY_WINDOW_ID
set -ga update-environment KITTY_LISTEN_ON
set -ga update-environment WEZTERM_PANE

# --- Visual Styles ---

# --- Centered Icon (three-region status bar) ---
# tmux draws the window list immediately after status-left, which made a
# centre icon collide with the window IDs. Instead we override status-format[0]
# (tmux 3.7+) with an explicit three-region layout:
#   left   -> session name + window list (unchanged, untouched)
#   centre -> the icon, pinned to the exact middle with #[align=centre]
#   right  -> clock / date / pane title (unchanged)
# This keeps window IDs fully intact and puts the icon in a private centre slot.
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=centre]#[fg=yellow]⚡#[default]#[norange default] #[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

set-option -g status on
set -g status-style bg=default,bold
set -g status-left-length 200
set -g status-right-length 60

# --- Window/Pane Management ---
# New window/split with current path
bind c new-window -c "#{pane_current_path}"
unbind %
bind k split-window -h -c "#{pane_current_path}"
unbind '"'
bind o split-window -v -c "#{pane_current_path}"

# Toggle status bar
bind-key b set status

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Alt+number to switch windows
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# --- Smart Pane Navigation (Vim/Tmux Aware) ---
# This replaces your redundant C-h/j/k/l blocks
is_vim="~/.config/tmux/check_vim.sh"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

# Navigation within Copy Mode
bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/copy-to-clipboard '#{client_tty}'"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/copy-to-clipboard '#{client_tty}'"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Always reserve left-drag for tmux selection, including in mouse-aware apps.
bind-key -T root MouseDrag1Pane copy-mode -M
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/copy-to-clipboard '#{client_tty}'"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/copy-to-clipboard '#{client_tty}'"
